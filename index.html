<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0c0a" />
  <title>KARMA OS — Intelligence, in motion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <button class="brand" data-nav="HOME" aria-label="KARMA OS home"><span class="brand-mark">K</span><span class="brand-copy">KARMA<span>OPERATING SYSTEM</span></span></button>
      <div class="side-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-nav="HOME"><span class="nav-icon">◫</span>Home <span class="nav-count">01</span></button>
        <button class="nav-item" data-nav="AI LAB"><span class="nav-icon">✳</span>AI Lab</button>
        <button class="nav-item" data-nav="CREATE"><span class="nav-icon">⌁</span>Create</button>
        <button class="nav-item" data-nav="TOOLS"><span class="nav-icon">◈</span>Tools <span class="nav-count">12</span></button>
      </nav>
      <div class="side-label second-label">PREFERENCES</div>
      <nav class="main-nav">
        <button class="nav-item" data-nav="SETTINGS"><span class="nav-icon">⚙</span>Settings</button>
      </nav>
      <div class="side-spacer"></div>
      <div class="sidebar-bottom">
        <div class="mini-status"><span class="status-pulse"></span><div><b>All systems nominal</b><small>Last checked just now</small></div><span class="tiny-chevron">↗</span></div>
        <button class="restricted-link" id="restricted-trigger"><span class="lock-icon">▣</span> RESTRICTED ACCESS <span class="restricted-dot"></span></button>
        <div class="account-card"><div class="avatar">K</div><div class="account-copy"><b>Workspace owner</b><small>Personal workspace</small></div><button class="icon-button" id="profile-menu" aria-label="Profile options">···</button></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>KARMA OS</span><span class="crumb-slash">/</span><b id="current-section">OVERVIEW</b></div>
        <div class="top-actions"><div class="system-pill"><span class="status-pulse"></span> SYSTEM ONLINE</div><button class="icon-button notification" id="notifications" aria-label="Notifications">♧<i></i></button><button class="top-avatar" data-nav="SETTINGS">K</button></div>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
